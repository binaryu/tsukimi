name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "*"
    paths-ignore:
      - "docs/**"
      - "**/.gitignore"
      - "**/.dockerignore"
      - "LICENSE"
      - "**/*.md"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "docs/**"
      - "**/.gitignore"
      - "**/.dockerignore"
      - "LICENSE"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yaml
    secrets: inherit

  linux:
    name: Linux
    uses: ./.github/workflows/build_linux.yml
    secrets: inherit

  arch:
    name: Arch
    # The Arch package is the only reason a release needs this job, and it costs
    # ten minutes of clean-container compilation. Building it for every push and
    # pull request buys nothing: those runs do not publish anything.
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/build_arch.yml
    secrets: inherit

  artifacts:
    name: Artifacts
    # Keep uploading the Linux tarballs for branch builds, where `arch` is
    # skipped on purpose.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.linux.result == 'success' }}
    uses: ./.github/workflows/artifacts.yml
    needs: [linux, arch]
    secrets: inherit