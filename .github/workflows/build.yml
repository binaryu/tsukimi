name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
    tags:
      - "*"
    paths-ignore:
      - "docs/**"
      - "**/.gitignore"
      - "**/.dockerignore"
      - "LICENSE"
      - "**/*.md"
  pull_request:
    branches:
      - "main"
    paths-ignore:
      - "docs/**"
      - "**/.gitignore"
      - "**/.dockerignore"
      - "LICENSE"
      - "**/*.md"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yaml
    secrets: inherit

  linux:
    name: Linux
    uses: ./.github/workflows/build_linux.yml
    secrets: inherit

  arch:
    name: Arch
    uses: ./.github/workflows/build_arch.yml
    secrets: inherit

  artifacts:
    name: Artifacts
    if: ${{ github.event_name != 'pull_request' }}
    uses: ./.github/workflows/artifacts.yml
    needs: [linux, arch]
    secrets: inherit